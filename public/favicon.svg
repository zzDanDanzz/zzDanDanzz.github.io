<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <!-- Tailwind indigo-500 (#6366f1) to purple-600 (#9333ea) -->
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>
  
  <!-- The background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#dzGrad)" />
  
  <!-- The 'DZ' text -->
  <text 
    x="256" 
    y="52%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="700" 
    font-size="260"
    letter-spacing="-5"
  >
    DZ
  </text>
</svg>
